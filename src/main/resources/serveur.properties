# Configuration du ConnecteurServeur
# Port d'écoute du serveur (connexion client)
serveur.port=31416

# Port du serveur HTTP pour transfert de fichiers multipart
# 0 = désactivé (pas de serveur HTTP)
serveur.http.port=8080

# Configuration du pool de threads
serveur.threadPool.coreSize=4
serveur.threadPool.maxSize=50
serveur.threadPool.queueSize=100

# Timeouts (en millisecondes)
serveur.timeout.socket=30000
serveur.timeout.watchdog=30000

# Heartbeat (en millisecondes)
serveur.heartbeat.interval=60000

# Validation des paquets
serveur.validation.maxPacketSize=10
serveur.validation.maxRequestSize=100

# Logging
logging.level=INFO
logging.format=[%s] %s - %s
